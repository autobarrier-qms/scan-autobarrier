<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16253D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>AUTOBARRIER · Scan boîtes</title>
<style>
:root{--bleu:#16253D;--acc:#1F6FEB;--ok:#1B7F4B;--ko:#B3261E;--or:#B25E09;--bg:#F3F5F9;--c:#fff;--tx:#16253D;--mu:#5B6B82;--li:#D5DBE6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bleu);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:17px;letter-spacing:.3px}header small{opacity:.75;display:block;font-size:12px}
header .sp{flex:1}header button{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:14px 16px 90px;max-width:560px;margin:0 auto}
h2{font-size:19px;margin:6px 0 4px}.sub{color:var(--mu);margin:0 0 12px;font-size:14px}
.card{background:var(--c);border:1px solid var(--li);border-radius:14px;padding:14px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px;font-weight:600}
input,select{width:100%;font:inherit;padding:13px 12px;border:1.5px solid var(--li);border-radius:10px;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input[readonly]{background:#EEF1F6}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font:inherit;font-weight:700;font-size:17px;background:var(--acc);color:#fff;margin:10px 0 0}
.btn.ok{background:var(--ok)}.btn.ko{background:var(--ko)}.btn.sec{background:#fff;color:var(--tx);border:1.5px solid var(--li)}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.mis{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--li);border-radius:12px;padding:14px;margin:0 0 10px;font:inherit}
.mis b{display:block;font-size:16px}.mis span{color:var(--mu);font-size:13px}
.err{background:#FDECEA;border:1px solid #F3B9B4;color:#7A1510;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.inf{background:#E8F1FE;border:1px solid #BCD3F8;color:#12407F;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.warn{background:#FFF4E0;border:1px solid #F0CF98;color:#6B3F05;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.okb{background:#E6F5EC;border:1px solid #A9D9BD;color:#0E4F2D;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.steps{display:flex;gap:6px;margin:0 0 12px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--li)}.steps i.on{background:var(--acc)}.steps i.fait{background:var(--ok)}
.steplab{font-size:13px;color:var(--mu);margin:0 0 8px}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .vis{position:absolute;inset:18% 8%;border:2px solid #fff9;border-radius:10px;pointer-events:none}
.cam.lotmode .vis{inset:42% 6%;border-color:#4ade80;border-width:3px}
.cam .msg{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:13px;padding:6px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:#E6F5EC;border:1px solid #A9D9BD;color:#0E4F2D;border-radius:20px;padding:5px 10px;font-size:13px}
.chip.x{background:#EEF1F6;border-color:var(--li);color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 0;border-bottom:1px solid var(--li);vertical-align:top}td:first-child{color:var(--mu);width:42%}
.bx{border:1.5px solid var(--li);border-radius:12px;padding:12px;margin:0 0 10px;background:#fff}
.bx .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.tag{font-size:12px;border-radius:12px;padding:2px 8px;font-weight:700}.tag.o{background:#FFF4E0;color:#6B3F05}.tag.v{background:#E6F5EC;color:#0E4F2D}.tag.g{background:#EEF1F6;color:var(--mu)}.tag.r{background:#FDECEA;color:#7A1510}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pad button{padding:16px 0;font-size:22px;font-weight:700;border-radius:12px;border:1.5px solid var(--li);background:#fff;color:var(--tx)}
.big{font-size:44px;font-weight:800;text-align:center;margin:4px 0}
.mini{font-size:12px;color:var(--mu)}
.hid{display:none!important}
.ov{position:fixed;inset:0;background:#16253DCC;display:flex;align-items:center;justify-content:center;z-index:20;color:#fff;font-weight:700}

header .net{background:#ffffff1f;border:0;border-radius:20px;padding:6px 11px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
header .net.hl{background:#B25E09}header .net.ok{background:#1B7F4B}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16253DEE;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%;text-align:center}
.sh{position:fixed;inset:0;z-index:30;background:#16253D88;display:flex;align-items:flex-end;justify-content:center}
.shc{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 26px;max-height:88vh;overflow:auto}
.shc h3{margin:0 0 6px;font-size:18px}
.sw{display:flex;align-items:center;gap:12px;background:#F3F5F9;border:1.5px solid var(--li);border-radius:14px;padding:12px;margin:10px 0}
.sw b{display:block}.sw .mini{margin-top:2px}.sw>div{flex:1}
.tg{position:relative;width:54px;height:32px;border-radius:16px;background:#B8C2D3;border:0;flex:none;transition:.15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:.15s}
.tg.on{background:#B25E09}.tg.on::after{left:25px}
.card.env{border-color:#F0CF98;background:#FFFAF0}
.tag.l{background:#FFF4E0;color:#6B3F05}
</style>
</head>
<body>
<header><div><b>AUTOBARRIER</b><small id="hSub">Scan des boîtes</small></div><span class="sp"></span><button id="net" class="net" onclick="ouvrirNet()">…</button><button id="hBtn" class="hid"></button></header>
<main id="app"></main>
<div id="ov" class="ov hid">Envoi en cours…</div>
<div id="sh" class="sh hid" onclick="if(event.target===this)fermerSheet()"><div class="shc" id="shc"></div></div>
<div id="toast" class="toast hid"></div>
<script src="parser.js"></script>
<script src="zxing-reader.js"></script>
<script src="ocr_lot.js"></script>
<script>
'use strict';
/* ====================== AUTOBARRIER · module téléphone V13.21 ======================
   Aucune donnée de production n'est conservée dans le téléphone : seuls le lien d'installation
   (adresse + jeton + nom du téléphone) et, le temps de l'onglet, l'identité de l'opérateur.
   Une boîte passe par : 1) l'étiquette  2) la quantité NOK  3) la clôture (boîte ou palette). */
var LS = (function () { try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return localStorage; } catch (e) { return { getItem: function () { return null; }, setItem: function () {}, removeItem: function () {} }; } })();
var SS = (function () { try { sessionStorage.setItem('_t', '1'); sessionStorage.removeItem('_t'); return sessionStorage; } catch (e) { return { getItem: function () { return null; }, setItem: function () {}, removeItem: function () {} }; } })();
var $ = function (s) { return document.querySelector(s); };
var esc = function (v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); };
var CF = { url: '', k: '', a: '' };   /* installation */
var CFG = null;                        /* missions, opérateurs, motifs : relus du serveur à chaque ouverture */
var OP = null;                         /* { mat, nom } */
var MIS = null;                        /* mission choisie */
var SC = null;                         /* boîte en cours : { champs, box } */
var cam = null;

/* ---------- installation par lien : #u=<adresse>&k=<jeton>&a=<téléphone> ---------- */
(function () {
  var h = location.hash.replace(/^#/, '');
  if (h) {
    var p = {}; h.split('&').forEach(function (x) { var i = x.indexOf('='); if (i > 0) p[x.slice(0, i)] = decodeURIComponent(x.slice(i + 1)); });
    if (p.u && p.k) { LS.setItem('ab_cf', JSON.stringify({ url: p.u, k: p.k, a: p.a || 'TEL' })); }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  try { CF = JSON.parse(LS.getItem('ab_cf') || 'null') || CF; } catch (e) {}
  try { OP = JSON.parse(SS.getItem('ab_op') || 'null'); } catch (e) {}
})();

/* ---------- état hors ligne ---------- */
var HL = LS.getItem('ab_hl') === '1';      /* mode hors ligne choisi par l'opérateur */
var RESO = true;                            /* dernier état connu du réseau */
var ENVOI = null;                           /* envoi en cours (promesse) */
var OUT = [];                               /* boîtes gardées sur le téléphone, en attente d'envoi */
try { OUT = JSON.parse(LS.getItem('ab_out') || '[]') || []; } catch (e) { OUT = []; }
function sauveOut() { try { LS.setItem('ab_out', JSON.stringify(OUT)); } catch (e) { toast('Mémoire du téléphone pleine : envoyez vos boîtes.'); } majNet(); }
function enLigne() { return !HL && RESO && navigator.onLine !== false; }
function prete(r) { return !!(r.annuler || r.clore || r.attente || (r.sid && r.nok)); }
function nAEnv() { return OUT.filter(function (r) { return prete(r) && !r.err; }).length; }

/* ---------- appel au serveur : une requête texte brut, sans préparation (pas de blocage navigateur) ---------- */
function api(act, d) {
  if (HL && act !== 'sync') return Promise.resolve({ ok: false, code: 'RESEAU', err: 'Mode hors ligne.' });
  var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 30000);
  var body = Object.assign({ k: CF.k, a: CF.a, act: act }, OP ? { mat: OP.mat, nom: OP.nom } : {}, d || {});
  return fetch(CF.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal, redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) { clearTimeout(to); if (!RESO) { RESO = true; majNet(); } return j; })
    .catch(function (e) { clearTimeout(to); if (RESO) { RESO = false; majNet(); } return { ok: false, code: 'RESEAU', err: 'Réseau indisponible ou serveur trop lent. Rien n’a été enregistré : réessayez.' }; });
}
function busy(on, t) { $('#ov').textContent = t || 'Envoi en cours…'; $('#ov').classList.toggle('hid', !on); }
function vib(n) { try { navigator.vibrate && navigator.vibrate(n || 60); } catch (e) {} }
function bip() { try { var a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.frequency.value = 1100; o.connect(a.destination); o.start(); setTimeout(function () { o.stop(); a.close(); }, 90); } catch (e) {} }

function vue(h, titre, retour) {
  stopCam();
  $('#app').innerHTML = h;
  $('#hSub').textContent = titre || 'Scan des boîtes';
  var b = $('#hBtn');
  if (retour) { b.textContent = retour.t; b.onclick = retour.f; b.classList.remove('hid'); } else b.classList.add('hid');
  window.scrollTo(0, 0);
}
function erreur(m) { return m ? '<div class="err">' + esc(m) + '</div>' : ''; }

/* ---------- 0 · démarrage ---------- */
function demarrer() {
  if (!CF.url || !CF.k) {
    vue('<h2>Téléphone non installé</h2><p class="sub">Ouvrez le <b>lien d’installation</b> envoyé par le responsable qualité (une seule fois). Il enregistre l’adresse du serveur et le nom de ce téléphone.</p>', 'Installation');
    return;
  }
  var cache = null; try { cache = JSON.parse(LS.getItem('ab_cfg') || 'null'); } catch (e) {}
  var suite = function (c, hors) { CFG = c.cfg; CFG.__maj = c.t; OP ? choixMission() : identification(); majNet(); };
  if (HL || navigator.onLine === false) {
    if (cache) return suite(cache, true);
    return vue('<h2>Première connexion requise</h2><p class="sub">Le téléphone doit se connecter une première fois pour charger les missions, les références et les défauts. Activez le réseau puis réessayez.</p><button class="btn" onclick="HL=false;LS.setItem(\'ab_hl\',\'0\');demarrer()">Réessayer</button>', 'Connexion');
  }
  vue('<p class="sub">Connexion au serveur…</p>', 'Connexion');
  api('config').then(function (r) {
    if (r.ok) { var c = { cfg: r.cfg, t: new Date().toISOString() }; try { LS.setItem('ab_cfg', JSON.stringify(c)); } catch (e) {} return suite(c); }
    if (r.code === 'RESEAU' && cache) { toast('Pas de réseau : missions chargées depuis le téléphone'); return suite(cache, true); }
    vue('<h2>Connexion impossible</h2>' + erreur(r.err) + '<button class="btn" onclick="demarrer()">Réessayer</button>', 'Connexion');
  });
}

/* ---------- 1 · identification ---------- */
function identification(m) {
  vue('<h2>Qui scanne ?</h2><p class="sub">Votre matricule et votre nom complet sont enregistrés avec chaque boîte.</p>' + erreur(m) +
    '<div class="card"><label>Matricule</label><input id="mat" inputmode="text" autocomplete="off" autocapitalize="characters" value="' + esc(OP ? OP.mat : '') + '" oninput="matSaisi()">' +
    '<label>Nom et prénom</label><input id="nom" autocomplete="off" value="' + esc(OP ? OP.nom : '') + '"><div id="matInfo" class="mini"></div></div>' +
    '<button class="btn" onclick="idOK()">Continuer</button>', 'Identification');
}
function matSaisi() {
  var m = $('#mat').value.trim().toUpperCase(), r = (CFG.operateurs || []).filter(function (x) { return x[0].toUpperCase() === m; })[0];
  $('#matInfo').textContent = r ? 'Matricule reconnu.' : (m ? 'Matricule non reconnu : saisissez votre nom complet ; le responsable qualité vérifiera.' : '');
  if (r) $('#nom').value = r[1];
}
function idOK() {
  var m = $('#mat').value.trim().toUpperCase(), n = $('#nom').value.trim().replace(/\s+/g, ' ');
  if (!m) return identification('Saisissez votre matricule.');
  if (n.split(' ').length < 2) { OP = { mat: m, nom: n }; return identification('Saisissez votre nom ET votre prénom.'); }
  OP = { mat: m, nom: n }; SS.setItem('ab_op', JSON.stringify(OP)); choixMission();
}

/* ---------- 2 · mission ---------- */
function choixMission(m) {
  var L = (CFG.missions || []);
  vue('<h2>Bonjour ' + esc(OP.nom.split(' ')[0]) + '</h2><p class="sub">Choisissez la mission que vous contrôlez.</p>' + erreur(m) +
    (L.length ? L.map(function (x, i) { return '<button class="mis" onclick="missionOK(' + i + ')"><b>' + esc(x.client) + '</b><span>' + esc(x.code) + (x.nom ? ' · ' + esc(x.nom) : '') + (x.site ? ' · ' + esc(x.site) : '') + '</span></button>'; }).join('')
      : '<div class="warn">Aucune mission n’est ouverte au scan. Le responsable qualité doit l’activer dans la mission (option « Scan »).</div>') +
    '<button class="btn sec" onclick="actualiser()">Actualiser la liste</button>', 'Mission', { t: 'Ce n’est pas moi', f: function () { OP = null; SS.removeItem('ab_op'); identification(); } });
}
function actualiser() { SC = null; demarrer(); }
function missionOK(i) { MIS = CFG.missions[i]; accueil(); }

/* ---------- 3 · accueil : mes boîtes ---------- */
function mN(x) { var t = String(x == null ? '' : x).trim(); return /^\d+$/.test(t) ? String(parseInt(t, 10)) : t; }
function isoLocal(d) { function p(n) { return (n < 10 ? '0' : '') + n; } return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
function boxDe(r) {
  var o = r.ouv || r.aff || {};
  return { id: r.cid, local: true, sid: r.sid || '', mission: r.mission, ref: o.ref, qt: o.qt, lot: o.lot, serial: o.serial, palette: o.palette || '',
    statut: r.attente ? 'EN_ATTENTE' : r.clore ? 'CLOTUREE' : r.nok ? 'NOK_DECLARE' : 'OUVERTE', nok: r.nok ? r.nok.nok : null, motifs: r.nok ? r.nok.motifs : [], tScan: isoLocal(new Date(r.tPhone)) };
}
function recDe(id) { return OUT.filter(function (r) { return r.cid === id || r.sid === id; })[0] || null; }
function majRec(b, f) {
  var r = recDe(b.id);
  if (!r) { r = { cid: 's' + b.id, sid: b.id, mat: OP.mat, nom: OP.nom, mission: b.mission || MIS.code, tPhone: new Date().toISOString(), aff: { ref: b.ref, qt: b.qt, lot: b.lot, palette: b.palette } }; OUT.push(r); }
  f(r); sauveOut(); return r;
}
function pret(b) { return b.statut === 'NOK_DECLARE' || (b.statut === 'OUVERTE' && !MIS.nokOp); }

function accueil(m, info) {
  var cache = null; try { cache = JSON.parse(LS.getItem('ab_liste') || 'null'); } catch (e) {}
  var vide = { ouvertes: [], clotures: [], t: '' };
  if (!enLigne()) return dessinAccueil(cache && cache.mat === mN(OP.mat) ? cache : vide, m, info);
  busy(true, nAEnv() ? 'Envoi des boîtes gardées sur le téléphone…' : 'Chargement…');
  (nAEnv() ? envoyerTout(true) : Promise.resolve(null)).then(function (res) {
    var info2 = info || (res && res.n ? '✓ ' + res.n + ' boîte(s) envoyée(s) au serveur.' : '');
    return api('liste').then(function (r) {
      busy(false);
      if (r.ok) { r.t = new Date().toISOString(); r.mat = mN(OP.mat); try { LS.setItem('ab_liste', JSON.stringify(r)); } catch (e) {} return dessinAccueil(r, m, info2); }
      if (r.code === 'RESEAU') return dessinAccueil(cache && cache.mat === mN(OP.mat) ? cache : vide, m, info2);
      vue('<h2>Mes boîtes</h2>' + erreur(r.err) + '<button class="btn" onclick="accueil()">Réessayer</button>', 'Mes boîtes', { t: 'Missions', f: function () { choixMission(); } });
    });
  });
}
function ligneMini(b) { return esc(b.ref) + ' · qté ' + b.qt + (b.nok != null ? ' · NOK ' + b.nok : '') + (b.statut === 'EN_ATTENTE' ? ' · en attente du RQ' : ''); }
function dessinAccueil(r, m, info) {
  var loc = OUT.filter(function (x) { return x.mission === MIS.code && mN(x.mat) === mN(OP.mat) && !x.annuler; });
  var cache = {}; loc.forEach(function (x) { if (x.sid) cache[x.sid] = 1; }); OUT.forEach(function (x) { if (x.annuler && x.sid) cache[x.sid] = 1; });
  var O = (r.ouvertes || []).filter(function (b) { return b.mission === MIS.code && !cache[b.id]; }).concat(loc.filter(function (x) { return !x.clore && !x.attente; }).map(boxDe));
  var AE = loc.filter(function (x) { return x.clore || x.attente; });
  var prets = O.filter(pret), pal = {}; prets.forEach(function (b) { if (b.palette) pal[b.palette] = (pal[b.palette] || 0) + 1; });
  window.__O = O;
  var h = '<h2>' + esc(MIS.client) + '</h2><p class="sub">' + esc(MIS.code) + ' · ' + esc(OP.nom) + '</p>' + (info ? '<div class="okb">' + esc(info) + '</div>' : '') + erreur(m);
  if (!enLigne()) h += '<div class="warn">📴 <b>Hors ligne.</b> Vos boîtes sont gardées sur le téléphone et seront envoyées dès que vous serez en ligne.</div>';
  h += '<button class="btn" onclick="nouvelle()">📷  Scanner une boîte</button>';
  var att = AE.filter(function (x) { return !x.err; }), errs = AE.filter(function (x) { return x.err; });
  if (att.length) {
    h += '<div class="card env" style="margin-top:14px"><b>📤 À envoyer (' + att.length + ')</b><div class="mini" style="margin-bottom:6px">Boîtes terminées, gardées sur ce téléphone.</div>' +
      att.map(function (x) { return '<div class="mini" style="color:var(--tx);padding:3px 0">• ' + ligneMini(boxDe(x)) + '</div>'; }).join('') +
      '<button class="btn" onclick="envoyerClic()">' + (enLigne() ? 'Envoyer maintenant' : 'Envoyer (réseau nécessaire)') + '</button></div>';
  }
  errs.forEach(function (x) {
    h += '<div class="err"><b>' + ligneMini(boxDe(x)) + '</b><br>' + esc(x.err) + '<div class="row" style="margin-top:8px"><button class="btn sec" style="padding:10px;font-size:15px;margin:0" onclick="reessayer(\'' + x.cid + '\')">Réessayer</button>' +
      '<button class="btn ko" style="padding:10px;font-size:15px;margin:0" onclick="supprRec(\'' + x.cid + '\')">Supprimer</button></div></div>';
  });
  if (O.length) {
    h += '<h2 style="margin-top:20px">Mes boîtes ouvertes (' + O.length + ')</h2><p class="sub">Vous pouvez laisser plusieurs boîtes ouvertes (par exemple pour une palette) : elles ne sont comptées qu’une fois clôturées.</p>';
    O.forEach(function (b) {
      var etat = b.statut === 'NOK_DECLARE' ? '<span class="tag v">NOK déclaré : ' + b.nok + '</span>' : '<span class="tag o">NOK à déclarer</span>';
      h += '<div class="bx"><div class="t"><span>' + esc(b.ref) + '</span>' + etat + '</div><div class="mini">' + (b.local ? '<span class="tag l">📱 sur le téléphone</span> ' : '') + 'Qté ' + b.qt + ' · lot ' + esc(b.lot || '—') + (b.palette ? ' · palette ' + esc(b.palette) : '') + ' · ' + esc(String(b.tScan || '').slice(11, 16)) + '</div>' +

  $('#fmt').textContent = { knauf: 'Étiquette KNAUF', onetech: 'Étiquette OneTech', seat: 'Étiquette SEAT / VW', standard: 'Étiquette STANDARD PROFIL', autre: 'Étiquette' }[d.format];
  majRef(); btn1();
}

/* ---------- 5 · étape 2 : la quantité NOK ---------- */
function etape2(id, b) {
  b = b || (window.__O || []).filter(function (x) { return x.id === id; })[0] || SC && SC.box;
  if (!b) return accueil();
  SC = SC || {}; SC.box = b; SC.nok = b.nok != null ? String(b.nok) : ''; SC.mot = (b.motifs || []).map(function (m) { return { m: m.m, q: String(m.q) }; }); SC.aucun = b.nok === 0;
  dessin2();
}
function dessin2(m) {
  var b = SC.box, nok = parseInt(SC.nok, 10), motifs = (MIS && MIS.motifs && MIS.motifs.length ? MIS.motifs : CFG.motifs) || [];
  var h = '<div class="steps"><i class="fait"></i><i class="on"></i><i></i></div><div class="steplab"><b>Étape 2 sur 3</b> · quantité NOK</div>' + erreur(m) +
    '<div class="card"><table><tr><td>Référence</td><td><b>' + esc(b.ref) + '</b></td></tr><tr><td>Quantité de la boîte</td><td><b>' + b.qt + '</b></td></tr><tr><td>Lot</td><td>' + esc(b.lot || '—') + '</td></tr></table></div>' +
    '<div class="card"><label style="margin-top:0">Quantité NOK</label><div class="big" id="nokv">' + (SC.nok === '' ? '—' : SC.nok) + '</div><div class="pad">' +
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button onclick="touche(\'' + n + '\')">' + n + '</button>'; }).join('') + '<button onclick="touche(\'C\')">⌫</button><button onclick="touche(\'0\')">0</button><button onclick="aucunNok()" style="font-size:14px;background:#E6F5EC">Aucun NOK</button></div>';
  if (nok > 0) {
    h += '<label>Motif du défaut' + (nok > 1 ? ' (2 motifs au maximum)' : '') + '</label>';
    var ms = SC.mot.length ? SC.mot : [{ m: '', q: String(nok) }];
    SC.mot = ms;
    ms.forEach(function (x, i) {
      h += '<div class="row" style="margin-bottom:8px"><select onchange="SC.mot[' + i + '].m=this.value" style="flex:2"><option value="">— choisir —</option>' + motifs.map(function (o) { return '<option' + (o === x.m ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>' +
        '<input inputmode="numeric" value="' + esc(x.q) + '" oninput="SC.mot[' + i + '].q=this.value" style="flex:1" placeholder="Qté"></div>';
    });
    if (ms.length < 2 && nok > 1) h += '<button class="btn sec" style="padding:10px;font-size:15px" onclick="SC.mot.push({m:\'\',q:\'\'});dessin2()">+ Un second motif</button>';
    if (ms.length > 1) h += '<button class="btn sec" style="padding:10px;font-size:15px" onclick="SC.mot.pop();dessin2()">Retirer le second motif</button>';
  }
  h += '</div><button class="btn" onclick="envoi2()" ' + (SC.nok === '' ? 'disabled' : '') + '>Envoyer le NOK</button><button class="btn sec" onclick="SC=null;accueil()">Plus tard</button>';
  vue(h, 'Étape 2 · NOK', { t: 'Retour', f: function () { SC = null; accueil(); } });
}
function touche(t) {
  var v = SC.nok; SC.aucun = false;
  if (t === 'C') v = v.slice(0, -1); else if (v.length < 4) v = (v === '0' ? '' : v) + t;
  SC.nok = v; if (parseInt(v, 10) === 0 && v !== '') { SC.nok = '0'; }
  if (parseInt(v, 10) > 0 && SC.mot.length === 1 && SC.mot.length) SC.mot[0].q = v;
  if (!(parseInt(v, 10) > 0)) SC.mot = [];
  dessin2();
}
function aucunNok() { SC.nok = '0'; SC.aucun = true; SC.mot = []; dessin2(); }
function validerNok(b, nok, mot) {
  var motifs = (MIS && MIS.motifs && MIS.motifs.length ? MIS.motifs : CFG.motifs) || [];
  if (isNaN(nok) || nok < 0) return 'Quantité NOK invalide.';
  if (nok > b.qt) return 'NOK (' + nok + ') supérieur à la quantité de la boîte (' + b.qt + ').';
  if (nok === 0) return '';
  if (!mot.length) return 'Choisissez le motif du défaut.';
  var s = 0, vus = {};
  for (var i = 0; i < mot.length; i++) {
    var q = parseInt(mot[i].q, 10);
    if (!mot[i].m) return 'Choisissez le motif du défaut.';
    if (!(q > 0)) return 'Quantité du motif « ' + mot[i].m + ' » invalide.';
    if (motifs.indexOf(mot[i].m) < 0) return 'Motif inconnu : ' + mot[i].m;
    if (vus[mot[i].m]) return 'Motif en double.'; vus[mot[i].m] = 1; s += q;
  }
  return s !== nok ? 'La somme des motifs (' + s + ') doit être égale au NOK (' + nok + ').' : '';
}
function nokLocal(b, nok, mot, perdu) {
  var e = validerNok(b, nok, mot); if (e) return dessin2(e);
  var M = nok === 0 ? [] : mot.map(function (x) { return { m: x.m, q: parseInt(x.q, 10) }; });
  var r = majRec(b, function (x) { x.nok = { nok: nok, aucun: nok === 0, motifs: M }; x.err = ''; x.bloque = false; });
  vib(80); SC = SC || {}; SC.box = boxDe(r); if (perdu) toast('Réseau perdu : NOK gardé sur le téléphone');
  etape3(SC.box);
}
function envoi2() {
  var nok = parseInt(SC.nok, 10); if (isNaN(nok)) return;
  if (nok === 0 && !SC.aucun) return dessin2('Appuyez sur « Aucun NOK » pour confirmer qu’il n’y a aucun défaut.');
  var mot = SC.mot.map(function (x) { return { m: x.m, q: x.q }; }), b = SC.box;
  if (b.local || !enLigne()) return nokLocal(b, nok, mot);
  busy(true);
  api('nok', { id: b.id, nok: nok, aucun: nok === 0, motifs: mot }).then(function (r) {
    busy(false);
    if (r.ok) { vib(80); SC.box = r.boite; return etape3(r.boite); }
    if (r.code === 'RESEAU') return nokLocal(b, nok, mot, true);
    dessin2(r.err);
  });
}

/* ---------- 6 · étape 3 : clôture ---------- */
function etape3(b) {
  SC = SC || {}; SC.box = b;
  var mot = (b.motifs || []).map(function (m) { return esc(m.m) + ' × ' + m.q; }).join(' ; ');
  vue('<div class="steps"><i class="fait"></i><i class="fait"></i><i class="on"></i></div><div class="steplab"><b>Étape 3 sur 3</b> · clôture</div>' +
    '<div class="card"><table><tr><td>Référence</td><td><b>' + esc(b.ref) + '</b></td></tr><tr><td>Quantité</td><td>' + b.qt + '</td></tr><tr><td>NOK</td><td><b>' + (b.nok == null ? 'non demandé' : b.nok) + '</b>' + (mot ? ' · ' + mot : '') + '</td></tr><tr><td>Lot</td><td>' + esc(b.lot || '—') + '</td></tr>' + (b.palette ? '<tr><td>Palette</td><td>' + esc(b.palette) + '</td></tr>' : '') + '<tr><td>Équipe</td><td>' + esc(b.equipe) + ' · ' + esc(b.date) + '</td></tr></table></div>' +
    '<div class="inf">Après la clôture, vous ne pouvez plus modifier cette boîte : seul le responsable qualité peut la rouvrir.</div>' + (!enLigne() ? '<div class="warn">📴 Hors ligne : la boîte sera gardée sur le téléphone, puis envoyée dès que vous serez en ligne.</div>' : '') +
    '<button class="btn ok" onclick="cloturer({ids:[SC.box.id]})">Clôturer cette boîte</button>' +
    (b.palette ? '<button class="btn sec" onclick="clorePalette(\'' + esc(b.palette) + '\')">Clôturer toute la palette ' + esc(b.palette) + '</button>' : '') +
    '<button class="btn sec" onclick="nouvelle()">Laisser ouverte et scanner la suivante</button>', 'Étape 3 · clôture', { t: 'Mes boîtes', f: function () { SC = null; accueil(); } });
}


/* ---------- envoi des boîtes gardées sur le téléphone ---------- */
function payload(r) { return { cid: r.cid, sid: r.sid || '', mat: r.mat, nom: r.nom, mission: r.mission, tPhone: r.tPhone, ouv: r.sid ? null : r.ouv, nok: r.nok || null, clore: !!r.clore, annuler: !!r.annuler }; }
function envoyerTout(silencieux) {
  if (ENVOI) return ENVOI;
  var todo = OUT.filter(function (r) { return prete(r) && !r.err; });
  if (!todo.length) return Promise.resolve({ n: 0, err: 0 });
  var n = 0, err = 0, stop = false, lots = [];
  for (var i = 0; i < todo.length; i += 5) lots.push(todo.slice(i, i + 5));
  ENVOI = lots.reduce(function (p, lot) {
    return p.then(function () {
      if (stop) return;
      return api('sync', { boites: lot.map(payload) }).then(function (r) {
        if (!r.ok) { if (r.code === 'RESEAU') { stop = true; return; } lot.forEach(function (x) { x.err = r.err || 'Envoi refusé.'; }); err += lot.length; return; }
        r.res.forEach(function (x) {
          var rec = OUT.filter(function (z) { return z.cid === x.cid; })[0]; if (!rec) return;
          if (x.ok) { OUT = OUT.filter(function (z) { return z.cid !== x.cid; }); n++; }
          else { rec.err = x.code === 'DOUBLON' ? 'Cette étiquette a déjà été scannée : ' + (x.err || '') : (x.err || 'Envoi refusé.'); rec.code = x.code || ''; err++; }
        });
      });
    });
  }, Promise.resolve()).then(function () { ENVOI = null; sauveOut(); return { n: n, err: err, coupe: stop }; });
  return ENVOI;
}
function envoyerClic() {
  if (HL) { HL = false; LS.setItem('ab_hl', '0'); }
  if (navigator.onLine === false) { majNet(); return toast('Aucun réseau détecté : activez le Wi-Fi ou les données mobiles.'); }
  RESO = true; majNet(); busy(true, 'Envoi des boîtes…');
  envoyerTout().then(function (res) {
    busy(false);
    if (res.coupe) return accueil('Connexion perdue pendant l’envoi : ' + res.n + ' boîte(s) envoyée(s), le reste est conservé sur le téléphone.');
    accueil(res.err ? res.err + ' boîte(s) à corriger (voir ci-dessous).' : '', res.n ? '✓ ' + res.n + ' boîte(s) envoyée(s) au serveur.' : '');
  });
}
function reessayer(cid) { var r = recDe(cid); if (r) { r.err = ''; r.bloque = false; sauveOut(); } envoyerClic(); }
function supprRec(cid) {
  demander('Supprimer cette boîte ? Elle ne sera jamais envoyée ni comptée.', 'Oui, supprimer', function () { OUT = OUT.filter(function (r) { return r.cid !== cid; }); sauveOut(); accueil('', 'Boîte supprimée.'); });
}
window.addEventListener('online', function () { RESO = true; majNet(); if (!HL && nAEnv() && MIS) { toast('Réseau retrouvé : envoi des boîtes…'); envoyerTout().then(function (r) { if (r.n) { toast('✓ ' + r.n + ' boîte(s) envoyée(s)'); if ($('#app') && !SC) accueil('', '✓ ' + r.n + ' boîte(s) envoyée(s) au serveur.'); } }); } });
window.addEventListener('offline', function () { RESO = false; majNet(); toast('Réseau perdu : les boîtes sont gardées sur le téléphone'); });

/* ---------- pastille de connexion, feuille de réglage, messages ---------- */
function majNet() {
  var b = $('#net'); if (!b) return;
  var n = nAEnv(), on = enLigne();
  b.className = 'net ' + (on ? 'ok' : 'hl');
  b.textContent = (on ? '🟢 En ligne' : (HL ? '📴 Hors ligne' : '📴 Pas de réseau')) + (n ? ' · 📤 ' + n : '');
}
function sheet(h) { $('#shc').innerHTML = h; $('#sh').classList.remove('hid'); }
function fermerSheet() { $('#sh').classList.add('hid'); }
function ouvrirNet() {
  var n = nAEnv(), tel = navigator.onLine !== false;
  sheet('<h3>Connexion</h3><div class="mini">' + (enLigne() ? '🟢 En ligne : chaque étape est envoyée tout de suite au serveur.' : HL ? '📴 Mode hors ligne choisi : rien n’est envoyé, tout est gardé sur le téléphone.' : '📴 Aucun réseau détecté : tout est gardé sur le téléphone automatiquement.') + '</div>' +
    '<div class="sw"><div><b>Travailler hors ligne</b><div class="mini">Gardez vos scans sur le téléphone (par exemple pour économiser vos données), puis envoyez tout d’un coup.</div></div><button class="tg' + (HL ? ' on' : '') + '" onclick="basculerHL()" aria-label="Mode hors ligne"></button></div>' +
    '<div class="card env"><b>📤 ' + n + ' boîte(s) à envoyer</b><div class="mini">' + (n ? 'Elles partiront dès que vous serez en ligne.' : 'Rien à envoyer.') + '</div>' +
    (n ? '<button class="btn" onclick="fermerSheet();envoyerClic()"' + (tel ? '' : ' disabled') + '>Envoyer maintenant</button>' + (tel ? '' : '<div class="mini">Aucun réseau détecté.</div>') : '') + '</div>' +
    '<div class="mini">ℹ️ Une page web ne peut pas couper la 4G/5G ou le Wi-Fi : pour les couper, utilisez les réglages du téléphone. Sans réseau, l’application bascule seule en mode hors ligne.</div>' +
    '<button class="btn sec" onclick="fermerSheet()">Fermer</button>');
}
function basculerHL() {
  HL = !HL; LS.setItem('ab_hl', HL ? '1' : '0'); majNet();
  if (HL) { ouvrirNet(); return; }
  fermerSheet(); RESO = true; majNet();
  if (nAEnv()) envoyerClic(); else if (MIS && OP) accueil('', 'Retour en ligne.');
}
var toastT = null;
function toast(t) { var e = $('#toast'); e.textContent = t; e.classList.remove('hid'); clearTimeout(toastT); toastT = setTimeout(function () { e.classList.add('hid'); }, 3500); }
function demander(txt, oui, cb) {
  window.__dem = cb;
  sheet('<h3>' + esc(txt) + '</h3><button class="btn" onclick="fermerSheet();var f=window.__dem;window.__dem=null;f&&f()">' + esc(oui) + '</button><button class="btn sec" onclick="fermerSheet()">Non</button>');
}
majNet();

if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
demarrer();
</script>
